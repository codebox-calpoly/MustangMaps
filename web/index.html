<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MustangMaps</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: #f7f7f5;
        color: #111827;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0f1115; color: #f9fafb; }
      }
      .wrap { max-width: 480px; text-align: center; }
      .pin { font-size: 56px; line-height: 1; margin-bottom: 12px; }
      h1 { font-size: 28px; margin: 0 0 8px; font-weight: 800; }
      p { color: #6b7280; line-height: 1.5; }
      @media (prefers-color-scheme: dark) { p { color: #9ca3af; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="pin">🐎</div>
      <h1>MustangMaps</h1>
      <p>The campus map for Cal Poly San Luis Obispo. An independent student project, not affiliated with or endorsed by California Polytechnic State University.</p>
    </div>
  </body>
</html>
